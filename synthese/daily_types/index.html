const TYPE_META = {
  retweet: { label: "RT", color: "#1e3a5f" },
  quote: { label: "Quote", color: "#E97032" },
  reply: { label: "Reply", color: "#2f6f9a" },
  mention: { label: "Mention", color: "#b8a06a" },
  original: { label: "Original", color: "#5f6e4e" }
};
const PEAKS = new Set([
  "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29",
  "2026-06-21","2026-06-22","2026-06-23","2026-06-24","2026-06-25",

]);
let mode = "in";

function types() { return mode === "in" ? DATA.typesIn : DATA.typesOut; }
function series(cid) { return mode === "in" ? DATA.in[String(cid)] : DATA.out[String(cid)]; }
function fmt(n) { return Number(n).toLocaleString("fr-FR"); }
function fmtDay(iso) {
  const [, m, d] = iso.split("-");
  return `${d}/${m}`;
}
function tickLabel(iso, i, n) {
  if (i === 0 || i === n - 1 || iso.endsWith("-01") || iso.endsWith("-15")) return fmtDay(iso);
  return "";
}

function renderLegend() {
  document.getElementById("legend").innerHTML = types().map(t =>
    `<li><span class="sw" style="background:${TYPE_META[t].color}"></span>${TYPE_META[t].label}</li>`
  ).join("");
  document.getElementById("note").textContent = mode === "in" ? DATA.definitionIn : DATA.definitionOut;
}

function totalDay(block, i) {
  return types().reduce((s, t) => s + (block[t][i] || 0), 0);
}
function maxAbs(block) {
  let m = 0;
  for (let i = 0; i < DATA.dates.length; i++) m = Math.max(m, totalDay(block, i));
  return m || 1;
}
function periodTotal(block) {
  return types().reduce((s, t) => s + block[t].reduce((a, b) => a + b, 0), 0);
}

function drawChart(el, block, kind) {
  const n = DATA.dates.length;
  const max = kind === "abs" ? maxAbs(block) : 1;
  const cols = DATA.dates.map((d, i) => {
    const tot = totalDay(block, i);
    const stackH = kind === "share" ? (tot ? 100 : 0) : (100 * tot / max);
    const segs = types().map(t => {
      const v = block[t][i] || 0;
      const h = tot ? (v / tot) * stackH : 0;
      return `<span class="segb" style="height:${h}%;background:${TYPE_META[t].color}"></span>`;
    }).join("");
    const peak = PEAKS.has(d) ? " is-peak" : "";
    return `<div class="col${peak}" data-i="${i}" data-cid="${el.dataset.cid}" data-kind="${kind}">${segs}</div>`;
  }).join("");
  const ticks = DATA.dates.map((d, i) => `<span>${tickLabel(d, i, n)}</span>`).join("");
  const topLab = kind === "share" ? "100 %" : fmt(max);
  el.innerHTML = `<div class="chart-wrap"><div class="ylab"><span>${topLab}</span><span>0</span></div><div class="chart">${cols}<div class="xaxis">${ticks}</div></div></div>`;
}

        </div>
        <div>
          <p class="panel-kicker">Volume absolu · max j. ${fmt(maxAbs(block))}</p>
          <div class="chart-frame"><div class="chart-host" data-cid="${c.id}" data-kind="abs"></div></div>
        </div>
      </div>
    </section>`;
  }).join("");
  root.querySelectorAll(".chart-host").forEach(el => {
    drawChart(el, series(el.dataset.cid), el.dataset.kind);
  });
}

function showTip(col, ev) {
  const i = Number(col.dataset.i);
  const cid = col.dataset.cid;
  const block = series(cid);
  const d = DATA.dates[i];
  const tot = totalDay(block, i);
  const rows = types().map(t => {
    const v = block[t][i] || 0;
    const p = tot ? (100 * v / tot) : 0;
    return `${TYPE_META[t].label} · ${fmt(v)} (${p.toFixed(1).replace(".", ",")} %)`;
  }).join("<br>");
  const comm = DATA.communities.find(c => String(c.id) === String(cid));
  tip.innerHTML = `<b>${fmtDay(d)} · C${cid} @${comm.hub}</b>${rows}<br><b>Total ${fmt(tot)}</b>`;
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 12, window.innerWidth - 180);
  const y = Math.min(ev.clientY + 12, window.innerHeight - 160);
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}

document.getElementById("comms").addEventListener("pointermove", ev => {
  const col = ev.target.closest(".col");
  if (!col) { tip.style.display = "none"; return; }
  showTip(col, ev);
});
document.getElementById("comms").addEventListener("pointerleave", () => { tip.style.display = "none"; });

document.querySelectorAll(".seg button").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("is-on", b === btn));
    render();
  });
});
render();
</script>
</body>
</html>
